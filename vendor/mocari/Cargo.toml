[package]
name = "mocari"
version = "0.4.0"
edition = "2024"
description = "Vendored pure Rust Live2D/Cubism-compatible runtime"
license = "MIT"
repository = "https://github.com/Eatgrapes/Mocari"
publish = false

[features]
default = []
wgpu = ["dep:gpui_wgpu"]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
gpui_wgpu = { git = "https://github.com/zed-industries/zed", optional = true }
