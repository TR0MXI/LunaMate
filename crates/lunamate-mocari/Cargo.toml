[package]
name = "mocari"
version = "0.4.0"
edition = "2024"
description = "LunaMate-maintained pure Rust Live2D/Cubism-compatible runtime"
license = "MIT"
repository = "https://github.com/Eatgrapes/Mocari"
publish = false

[features]
default = []
wgpu = ["dep:gpui_wgpu"]
benchmark-support = []

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
gpui_wgpu = { git = "https://github.com/zed-industries/zed", optional = true }

[[bench]]
name = "deformer_composition"
harness = false
required-features = ["benchmark-support"]

[[bench]]
name = "deformer_composition_allocations"
harness = false
required-features = ["benchmark-support"]

[dev-dependencies]
allocation-counter = "0.8.1"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
mimalloc = "0.1.52"
