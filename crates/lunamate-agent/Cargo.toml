[package]
name = "lunamate-agent"
version.workspace = true
edition.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[lints.clippy]
unwrap_used = "deny"

[dependencies]
async-channel.workspace = true
base64.workspace = true
flate2 = "1.1.9"
futures.workspace = true
genai.workspace = true
image.workspace = true
log.workspace = true
parking_lot.workspace = true
rapidhash.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "multipart", "stream", "gzip", "system-proxy"] }
rust-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url.workspace = true
uuid = { version = "1.25.0", features = ["v4"] }
