_version = 2

[status.model_saving]
"zh-CN" = "正在保存模型配置"
"zh-TW" = "正在儲存模型設定"
"en" = "Saving model settings"
"ja" = "モデル設定を保存しています"

[status.model_saved]
"zh-CN" = "模型配置已保存"
"zh-TW" = "模型設定已儲存"
