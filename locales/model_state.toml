_version = 2

[model_state.loading]
"zh-CN" = "正在加载模型：%{name}"
"zh-TW" = "正在載入模型：%{name}"
"en" = "Loading model: %{name}"
"ja" = "モデルを読み込み中: %{name}"

[model_state.loaded_with_warnings]
"zh-CN" = "模型已加载；%{summary}不可用"
"zh-TW" = "模型已載入；%{summary}無法使用"
"en" = "Model loaded; %{summary} unavailable"
"ja" = "モデルを読み込みました。%{summary}は利用できません"

[model_state.unavailable_motions]
"zh-CN" = "%{count} 项动作"
"zh-TW" = "%{count} 項動作"
"en" = "%{count} motion(s)"
"ja" = "動作 %{count} 件"

[model_state.unavailable_expressions]
"zh-CN" = "%{count} 项表情"
"zh-TW" = "%{count} 項表情"
"en" = "%{count} expression(s)"
"ja" = "表情 %{count} 件"

[model_state.unavailable_hit_areas]
"zh-CN" = "%{count} 个 HitArea"
"zh-TW" = "%{count} 個 HitArea"
"en" = "%{count} HitArea(s)"
"ja" = "HitArea %{count} 件"

[model_state.summary_separator]
"zh-CN" = "、"
"zh-TW" = "、"
"en" = ", "
"ja" = "、"

[model_state.unnamed]
"zh-CN" = "未命名模型"
"zh-TW" = "未命名模型"
"en" = "Unnamed model"
"ja" = "名称未設定モデル"

[model_state.initial_frame_failed]
"zh-CN" = "初始帧渲染失败：%{error}"
"zh-TW" = "初始幀渲染失敗：%{error}"
"en" = "Could not render the initial frame: %{error}"
"ja" = "初期フレームをレンダリングできませんでした: %{error}"

[model_state.load_failed]
"zh-CN" = "模型 %{name} 加载失败：%{error}"
"zh-TW" = "模型 %{name} 載入失敗：%{error}"
"en" = "Could not load model %{name}: %{error}"
"ja" = "モデル %{name} を読み込めませんでした: %{error}"

[model_state.render_failed]
"zh-CN" = "模型 %{name} 渲染失败：%{error}"
"zh-TW" = "模型 %{name} 渲染失敗：%{error}"
"en" = "Could not render model %{name}: %{error}"
"ja" = "モデル %{name} をレンダリングできませんでした: %{error}"
