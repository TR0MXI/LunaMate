"en" = "Could not back up the corrupt configuration file to %{path}: %{error}"
"ja" = "破損した設定ファイルを %{path} にバックアップできませんでした: %{error}"

[log.config_parent_sync_failed]
"zh-CN" = "配置文件已替换，但无法同步目录 %{path}；异常断电时可能丢失本次修改：%{error}"
"zh-TW" = "設定檔已取代，但無法同步目錄 %{path}；異常斷電時可能遺失本次修改：%{error}"
"en" = "The configuration file was replaced, but directory %{path} could not be synced; this update may be lost after an abrupt power failure: %{error}"
"ja" = "設定ファイルは置き換えられましたが、ディレクトリ %{path} を同期できませんでした。突然の電源断では変更が失われる可能性があります: %{error}"

[log.gpu_device_lost]
