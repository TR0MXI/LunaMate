_version = 2

[log.apply_settings_failed]
"zh-CN" = "应用日志配置失败，继续使用启动配置：%{error}"
"zh-TW" = "套用日誌設定失敗，繼續使用啟動設定：%{error}"
"en" = "Failed to apply logging settings; continuing with startup settings: %{error}"
"ja" = "ログ設定の適用に失敗しました。起動時の設定を使用します: %{error}"

[log.async_runtime_init_failed]
"zh-CN" = "无法初始化异步运行时，应用未启动：%{error}"
"zh-TW" = "無法初始化非同步執行環境，應用程式未啟動：%{error}"
"en" = "Could not initialize the async runtime; the application was not started: %{error}"
"ja" = "非同期ランタイムを初期化できないため、アプリケーションを起動しませんでした: %{error}"

[log.database_init_failed]
"zh-CN" = "嵌入式数据库初始化失败，存储功能已禁用：%{error}"
"zh-TW" = "嵌入式資料庫初始化失敗，儲存功能已停用：%{error}"
"en" = "The embedded database could not be initialized; persistence is disabled: %{error}"
"ja" = "組み込みデータベースを初期化できないため、永続化を無効にしました: %{error}"

[log.file_fallback]
"zh-CN" = "无法写入日志文件，已降级为 stderr：%{reason}"
"zh-TW" = "無法寫入日誌檔案，已改用 stderr：%{reason}"
"en" = "Could not write to the log file; falling back to stderr: %{reason}"
"ja" = "ログファイルに書き込めないため、stderr にフォールバックしました: %{reason}"

[log.config_rebuilt]
"zh-CN" = "配置文件 %{path} 已损坏，原文件已备份到 %{backup}，本次保存将重建有效 TOML：%{error}"
"zh-TW" = "設定檔 %{path} 已損壞，原檔案已備份到 %{backup}，本次儲存將重建有效的 TOML：%{error}"
"en" = "Configuration file %{path} is corrupt; the original was backed up to %{backup} and this save will rebuild valid TOML: %{error}"
"ja" = "設定ファイル %{path} が破損しています。元のファイルを %{backup} にバックアップし、今回の保存で有効な TOML を再構築します: %{error}"

[log.config_backup_failed]
"zh-CN" = "无法备份损坏的配置文件到 %{path}：%{error}"
