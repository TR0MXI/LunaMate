_version = 2

[chat.input_placeholder]
"zh-CN" = "输入消息"
"zh-TW" = "輸入訊息"
"en" = "Type a message"
"ja" = "メッセージを入力"

[chat.image_only_prompt]
"zh-CN" = "请查看这张图片。"
"zh-TW" = "請查看這張圖片。"
"en" = "Please inspect this image."
"ja" = "この画像を確認してください。"

[chat.event.model_part_clicked]
"zh-CN" = "[事件] 用户点击了 Live2D 模型的“%{part}”部位。请以当前人格自然回应这次互动。"
"zh-TW" = "[事件] 使用者點擊了 Live2D 模型的「%{part}」部位。請以目前人格自然回應這次互動。"
"en" = "[Event] The user clicked the \"%{part}\" area of the Live2D model. Respond naturally to this interaction in character."
"ja" = "[イベント] ユーザーが Live2D モデルの「%{part}」部位をクリックしました。現在のペルソナとして自然に反応してください。"

[chat.history_image_unavailable]
"zh-CN" = "这条历史消息中的图片已不可用。"
"zh-TW" = "這則歷史訊息中的圖片已無法使用。"
"en" = "The image from this historical message is no longer available."
"ja" = "この過去のメッセージの画像は利用できなくなりました。"

[chat.tool.screen_capture_description]
"zh-CN" = "仅在回答确实需要当前视觉上下文时，将用户屏幕截取为静态图片。不得试探性调用，且每轮最多调用一次。"
"zh-TW" = "僅在回答確實需要目前視覺內容時，將使用者螢幕擷取為靜態圖片。不得試探性呼叫，且每輪最多呼叫一次。"
"en" = "Capture the user's screen as a still image only when current visual context is necessary to answer. Do not call it speculatively or more than once per turn."
"ja" = "回答に現在の視覚情報が本当に必要な場合に限り、ユーザーの画面を静止画像としてキャプチャしてください。試行目的で呼び出さず、1ターンにつき1回だけ使用してください。"

[chat.tool.screen_capture_handoff]
"zh-CN" = "已获授权的 capture_screen 工具生成了这张截屏。请先查看图片再回答。"
"zh-TW" = "已獲授權的 capture_screen 工具產生了這張截圖。請先查看圖片再回答。"
"en" = "The authorized capture_screen tool produced this screenshot. Inspect it before answering."
"ja" = "許可された capture_screen ツールがこのスクリーンショットを生成しました。回答する前に画像を確認してください。"

[chat.tool.screen_capture_unavailable]
"zh-CN" = "capture_screen 工具未能提供请求的截屏。请在没有截屏的情况下继续回答。"
"zh-TW" = "capture_screen 工具無法提供要求的截圖。請在沒有截圖的情況下繼續回答。"
"en" = "The capture_screen tool could not provide the requested screenshot. Continue without it."
"ja" = "capture_screen ツールは要求されたスクリーンショットを取得できませんでした。画像なしで回答を続けてください。"

[chat.tool.change_outfit_description]
"zh-CN" = "将当前 Live2D 角色切换为指定服装。仅在符合当前情境或用户要求时调用，每轮最多调用一次。"
"zh-TW" = "將目前的 Live2D 角色切換為指定服裝。僅在符合目前情境或使用者要求時呼叫，每輪最多呼叫一次。"
"en" = "Change the current Live2D character into a specified outfit. Call this only when it fits the current context or the user's request, and at most once per turn."
"ja" = "現在の Live2D キャラクターを指定した衣装に着替えさせます。現在の状況またはユーザーの要望に合う場合に限り、1ターンにつき1回だけ呼び出してください。"

[chat.tool.change_outfit_argument]
"zh-CN" = "要切换的服装，必须从当前模型的可用服装中选择。"
"zh-TW" = "要切換的服裝，必須從目前模型的可用服裝中選擇。"
"en" = "The outfit to change into. Choose one of the outfits available for the current model."
"ja" = "着替える衣装です。現在のモデルで利用可能な衣装から選択してください。"

[chat.tool.result_handoff]
"zh-CN" = "本地工具执行结果如下：\n%{results}\n请根据结果继续回答。"
"zh-TW" = "本機工具執行結果如下：\n%{results}\n請根據結果繼續回答。"
"en" = "The local tool results are shown below:\n%{results}\nContinue your response using these results."
"ja" = "ローカルツールの実行結果は次のとおりです：\n%{results}\nこの結果に基づいて回答を続けてください。"

