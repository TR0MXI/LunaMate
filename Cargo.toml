[package]
name = "lunamate"
version = "0.1.0"
edition = "2024"

[lints.rust]
# objc 0.2.7 的宏会在调用 crate 中检查这个旧版 Clippy feature。
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[lints.clippy]
unwrap_used = "deny"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "wayland", "x11"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", version = "0.5.2" }
genai = "0.6.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
async-channel = "2.5.0"
arc-swap = "1.9.2"
toml_edit = "0.25.13"
gpui_tokio = { git = "https://github.com/zed-industries/zed", version = "0.1.0" }
futures = "0.3.33"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "sync"] }
url = "2.5.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
raw-window-handle = "0.6.2"
mimalloc = "0.1.52"
parking_lot = "0.12.5"
rust-i18n = "4.2.1"
mocari = { version = "0.4.0", path = "vendor/mocari", features = ["wgpu"] }
gpui_wgpu = { git = "https://github.com/zed-industries/zed", version = "0.1.0" }
log = "0.4.33"
flexi_logger = { version = "0.31.9", features = ["async", "compress"] }
# 生产构建仅包含本地 SurrealKV，不引入远程协议、原生 TLS、脚本或 ML。
surrealdb = { version = "3.2.3", default-features = false, features = ["kv-surrealkv"] }
base64 = "0.22.1"
ringbuf = "0.4.8"
cpal = "0.18.1"
rubato = "0.16.2"

[patch.crates-io]
# 上游 PR #14 修复了 2.0.1 中的 Rust future-incompatibility 警告。
proc-macro-error2 = { git = "https://github.com/fgardt/proc-macro-error-2", rev = "53ff94b61c678593158db1a3d50269c6f0de0db7" }

[target.'cfg(target_os = "windows")'.dependencies]
# 通用产物固定包含 Vulkan；raw-api 仅用于同步 Whisper 推理的可取消 callback。
whisper-rs = { version = "0.16.0", features = ["raw-api", "log_backend", "vulkan"] }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26.0"
objc = "0.2.7"
# Apple 平台通用产物固定包含系统 Metal 后端。
whisper-rs = { version = "0.16.0", features = ["raw-api", "log_backend", "metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux 截屏交给桌面门户，避免静态截图无条件引入 PipeWire/GBM 开发依赖。
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "screenshot"] }
# 托盘使用 StatusNotifierItem，避免为 GPUI 引入另一套 GTK 事件循环。
ksni = { version = "0.3.6", default-features = false, features = ["tokio"] }
wayland-client = { version = "0.31.15", features = ["system"] }
wayland-protocols = { version = "0.32.13", features = ["client"] }
# 通用产物固定包含 Vulkan；raw-api 仅用于同步 Whisper 推理的可取消 callback。
whisper-rs = { version = "0.16.0", features = ["raw-api", "log_backend", "vulkan"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# Windows 与 macOS 直接复用各自原生事件循环，不启用 GTK 相关默认 feature。
tray-icon = { version = "0.24.1", default-features = false }
# 只启用静态截图 API；不启用全格式 image 或 Windows Graphics Capture feature。
xcap = { version = "0.9.7", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[dev-dependencies]
# 仅测试目标需要 GPUI 的无头 TestAppContext；必须与生产依赖解析到同一 Zed commit。
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }
# 内存引擎只在本 crate 的测试目标中启用，常规 build 不会统一该 feature。
surrealdb = { version = "3.2.3", default-features = false, features = ["kv-mem"] }
# 仅为无图形会话的 pipeline 单元测试启用同一份 WGPU 29 noop backend。
wgpu = { version = "=29.0.4", features = ["noop"] }
