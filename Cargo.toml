[workspace]
members = [".", "crates/lunamate-agent", "crates/lunamate-mocari"]
default-members = [".", "crates/lunamate-agent"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
arc-swap = "1.9.2"
ashpd = { version = "0.13.13", default-features = false }
async-channel = "2.5.0"
base64 = "0.22.1"
flexi_logger = { version = "0.31.9", features = ["async", "compress"] }
futures = "0.3.33"
genai = "0.6.5"
global-hotkey = "0.8.0"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", version = "0.5.2" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "wayland", "x11"] }
gpui_tokio = { git = "https://github.com/zed-industries/zed", version = "0.1.0" }
gpui_wgpu = { git = "https://github.com/zed-industries/zed", version = "0.1.0" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
log = "0.4.33"
lunamate-agent = { path = "crates/lunamate-agent" }
mocari = { version = "0.4.0", path = "crates/lunamate-mocari", features = ["wgpu"] }
parking_lot = "0.12.5"
raw-window-handle = "0.6.2"
ringbuf = "0.4.8"
rust-i18n = "4.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
surrealdb = { version = "3.2.3", default-features = false, features = ["kv-surrealkv"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "sync"] }
toml_edit = "0.25.13"
url = "2.5.8"
xcap = { version = "0.9.7", default-features = false }

[package]
name = "lunamate"
version.workspace = true
edition.workspace = true

[lints.rust]
# objc 0.2.7 的宏会在调用 crate 中检查这个旧版 Clippy feature。
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[lints.clippy]
unwrap_used = "deny"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
image.workspace = true
async-channel.workspace = true
arc-swap.workspace = true
toml_edit.workspace = true
gpui_tokio.workspace = true
futures.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
raw-window-handle.workspace = true
mimalloc = "0.1.52"
parking_lot.workspace = true
rust-i18n.workspace = true
mocari.workspace = true
gpui_wgpu.workspace = true
log.workspace = true
flexi_logger.workspace = true
lunamate-agent.workspace = true
# 生产构建仅包含本地 SurrealKV，不引入远程协议、原生 TLS、脚本或 ML。
surrealdb.workspace = true
ringbuf.workspace = true
cpal = "0.18.1"
rubato = "0.16.2"
global-hotkey.workspace = true
tempfile = "3.27.0"
resvg = { version = "0.46.0", default-features = false }

[patch.crates-io]
# 上游 PR #14 修复了 2.0.1 中的 Rust future-incompatibility 警告。
proc-macro-error2 = { git = "https://github.com/fgardt/proc-macro-error-2", rev = "53ff94b61c678593158db1a3d50269c6f0de0db7" }

[target.'cfg(target_os = "windows")'.dependencies]
# 通用产物固定包含 Vulkan。
whisper-rs = { version = "0.16.0", features = ["log_backend", "vulkan"] }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26.0"
objc = "0.2.7"
# Apple 平台通用产物固定包含系统 Metal 后端。
whisper-rs = { version = "0.16.0", features = ["log_backend", "metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
# 根应用同时使用 GlobalShortcuts 与 Screenshot portal。
ashpd = { workspace = true, features = ["async-io", "global_shortcuts", "screenshot"] }
# 托盘使用 StatusNotifierItem，避免为 GPUI 引入另一套 GTK 事件循环。
ksni = { version = "0.3.6", default-features = false, features = ["tokio"] }
url.workspace = true
wayland-client = { version = "0.31.15", features = ["system"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
# 通用产物固定包含 Vulkan。
whisper-rs = { version = "0.16.0", features = ["log_backend", "vulkan"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# Windows 与 macOS 直接复用各自原生事件循环，不启用 GTK 相关默认 feature。
tray-icon = { version = "0.24.1", default-features = false }
# 只启用静态截图 API；不启用全格式 image 或 Windows Graphics Capture feature。
xcap.workspace = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[dev-dependencies]
# 仅测试目标需要 GPUI 的无头 TestAppContext；必须与生产依赖解析到同一 Zed commit。
gpui = { workspace = true, features = ["test-support"] }
# 内存引擎只在本 crate 的测试目标中启用，常规 build 不会统一该 feature。
surrealdb = { workspace = true, features = ["kv-mem"] }
# 仅为无图形会话的 pipeline 单元测试启用同一份 WGPU 29 noop backend。
wgpu = { version = "=29.0.4", features = ["noop"] }

[build-dependencies]
sha2 = "0.10.9"
