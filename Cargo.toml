[package]
name = "lunamate"
version = "0.1.0"
edition = "2024"

[lints.clippy]
unwrap_used = "deny"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "wayland", "x11"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", version = "0.5.2" }
genai = "0.6.5"
image = { version = "0.25.10", default-features = false }
async-channel = "2.5.0"
arc-swap = "1.9.2"
toml_edit = "0.25.13"
gpui_tokio = { git = "https://github.com/zed-industries/zed", version = "0.1.0" }
futures = "0.3.33"
tokio = { version = "1.53.0", features = ["time", "sync"] }
url = "2.5.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
raw-window-handle = "0.6.2"
mimalloc = "0.1.52"
parking_lot = "0.12.5"
rust-i18n = "4.2.1"
mocari = { version = "0.4.0", path = "vendor/mocari", features = ["wgpu"] }
gpui_wgpu = { git = "https://github.com/zed-industries/zed", version = "0.1.0" }

[patch.crates-io]
# 上游 PR #14 修复了 2.0.1 中的 Rust future-incompatibility 警告。
proc-macro-error2 = { git = "https://github.com/fgardt/proc-macro-error-2", rev = "53ff94b61c678593158db1a3d50269c6f0de0db7" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26.0"
objc = "0.2.7"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31.14", features = ["system"] }
wayland-protocols = { version = "0.32.13", features = ["client"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[dev-dependencies]
# 仅为无图形会话的 pipeline 单元测试启用同一份 WGPU 29 noop backend。
wgpu = { version = "=29.0.4", features = ["noop"] }
